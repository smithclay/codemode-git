name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The npm package ships only dist/, src/, LICENSE and package.json: no
      # demo video, voiceover, benchmark data or examples.
      - name: Check npm package contents
        working-directory: packages/codemode-git
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path);
            const extra = files.filter((p) => !/^(dist|src)\//.test(p) && !["LICENSE", "package.json", "README.md"].includes(p));
            if (extra.length) { console.error("Unexpected files in the npm package:\n" + extra.join("\n")); process.exit(1); }
            console.log(files.length + " files, all expected");'
      # Builds the example and checks the deploy without credentials.
      - run: npx cf build --mode production
        working-directory: examples/agent
      - run: npx cf deploy --prebuilt --mode production --dry-run
        working-directory: examples/agent
      # wrangler.jsonc mirrors cloudflare.config.ts for the Deploy to Cloudflare button.
      - run: npx wrangler deploy --dry-run
        working-directory: examples/agent
